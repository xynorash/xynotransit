name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter app (analyze, test, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xynotransit_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: PDF tools (the PDF text tests call pdftotext and pdffonts)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  api:
    name: API (fmt, clippy, tests on Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xynotransit-api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xynotransit
          POSTGRES_PASSWORD: xynotransit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xynotransit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xynotransit-api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  stack:
    name: Full Docker stack (build from scratch, smoke test)
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP_CONTROLLER_EMAIL: smoke.manager@xynotransit.example
      BOOTSTRAP_CONTROLLER_NAME: Smoke Manager
      LOG_MAGIC_LINKS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db, api, mailpit and web
        working-directory: xynotransit-db
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
      - name: Smoke test through nginx
        working-directory: xynotransit-db
        run: scripts/smoke.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Contract tests (the Flutter repository against the real API)
        working-directory: xynotransit_app
        run: |
          flutter pub get
          flutter test test/contract \
            --dart-define=CONTRACT_API=http://127.0.0.1:8080 \
            --dart-define=CONTRACT_MAIL=http://127.0.0.1:8025 \
            --dart-define=CONTRACT_MANAGER=smoke.manager@xynotransit.example
      - name: Logs on failure
        if: failure()
        working-directory: xynotransit-db
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        working-directory: xynotransit-db
        run: docker compose -f docker-compose.yml -f docker-compose.full.yml down -v

  images:
    name: Publish images to ghcr.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, api, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repository name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: xynotransit-api
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/api:latest
            ${{ env.IMAGE_BASE }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: xynotransit-db
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/db:latest
            ${{ env.IMAGE_BASE }}/db:${{ github.sha }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: xynotransit-db/web/Dockerfile.full
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/web:latest
            ${{ env.IMAGE_BASE }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
