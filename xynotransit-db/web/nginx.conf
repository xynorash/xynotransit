# Serves the Flutter web build and proxies /api/ to the axum backend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Docker DNS; resolving at request time lets web start before api.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location = /api/events {
        set $api http://api:8081;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location /api/ {
        set $api http://api:8081;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Entry points must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /version.json {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Content-hashed files and canvaskit never change under the same name.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }
    location ~* "\.[0-9a-f]{8,}\.(js|css|wasm|png|jpg|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Other static files: revalidate, then SPA fallback.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
