# DELIBERATE CHOICE: fonts.gstatic.com is allowed in connect-src and font-src. The Flutter web engine
# (built with --no-web-resources-cdn, so it ships its own canvaskit and the Latin font) still loads a
# fallback font at runtime when a name needs glyphs it does not have (CJK, Arabic, Cyrillic ...). The
# browser asks Google's font host ONLY when such glyphs appear; nothing else leaves this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
